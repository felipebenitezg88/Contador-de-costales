name: Compilar APK Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar APK temporal de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Contador-Costales-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Mantiene una descarga permanente de la última compilación de main.
      - name: Publicar APK más reciente
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: main
          name: APK más reciente
          body: "Versión de instalación más reciente generada automáticamente desde la rama main."
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true

      # Los tags v* publican versiones identificables que no se reemplazan.
      - name: Publicar versión etiquetada
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Contador de Costales ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
