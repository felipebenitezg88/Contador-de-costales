name: Entrenar detector de costales CONSEDE
on:
  workflow_dispatch:
  push:
    paths:
      - "ml/dataset/costales/images/train/**"
      - "ml/dataset/costales/images/val/**"
      - "ml/dataset/costales/labels/train/**"
      - "ml/dataset/costales/labels/val/**"
      - "ml/train.py"
      - "ml/validate_dataset.py"
      - "ml/data.yaml"
      - "ml/requirements.txt"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt
      - name: Validar dataset y etiquetas
        run: python ml/validate_dataset.py
      - name: Entrenar, validar y exportar TFLite
        run: python ml/train.py
      - name: Guardar modelo y métricas
        uses: actions/upload-artifact@v4
        with:
          name: conseDe-modelo-entrenado
          path: |
            runs/conseDe_costales/weights/best.pt
            runs/conseDe_costales/weights/last.pt
            runs/conseDe_costales/metrics.json
            runs/conseDe_costales/**/*.tflite
            runs/conseDe_costales/**/*.yaml
            runs/conseDe_costales/**/*.png
          if-no-files-found: error
          retention-days: 90
