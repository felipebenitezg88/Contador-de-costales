name: Descargar paquete de fotogramas CONSEDE
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar paquete
        run: |
          mkdir -p paquete/fotogramas
          cp ml/dataset/costales/frames/review/*.jpg paquete/fotogramas/
          cp ml/ANNOTATION_MANIFEST.csv paquete/
          cp ml/ANNOTATION_RULES_CONFIRMED.md paquete/
          cp ml/annotation-editor.html paquete/
          printf '%s\n' 'Extrae el ZIP. Abre annotation-editor.html en Chrome. Carga los JPG. Marca solo costales sobre la banda. Exporta las etiquetas al terminar.' > paquete/LEEME.txt
          test "$(find paquete/fotogramas -type f -name '*.jpg' | wc -l)" -eq 114
      - uses: actions/upload-artifact@v4
        with:
          name: CONSEDE-114-fotogramas-editor
          path: paquete/
          retention-days: 30
